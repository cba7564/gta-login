<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P!NK PANTY - 공주 클럽 운영앱</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap');
        body { font-family: 'Pretendard', sans-serif; }
        .neon-glow {
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3), inset 0 0 15px rgba(236, 72, 153, 0.1);
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(236, 72, 153, 0.7), 0 0 20px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>
<body class="min-h-screen bg-[#09050b] text-white flex flex-col items-center p-4 md:p-8">
    
    <div class="w-full max-w-4xl mx-auto space-y-6">
        
        <!-- 상단 타이틀 및 설정 버튼 -->
        <div class="flex flex-col md:flex-row justify-between items-center border-b border-pink-500/20 pb-4 gap-4">
            <div class="text-center md:text-left space-y-1">
                <h1 class="text-2xl md:text-3xl font-extrabold text-pink-400 tracking-wider neon-text">
                    P!NK PANTY • 공주 조직도 & 출퇴근부
                </h1>
                <p class="text-xs text-pink-300/70">P.P의 모든 멤버는 각자의 직급에 맞는 권한과 책임을 준수합니다.</p>
            </div>
            <button onclick="openSettingsModal()" class="px-4 py-2 bg-pink-500/20 hover:bg-pink-500/40 border border-pink-500/40 text-pink-300 rounded-xl text-xs font-bold transition flex items-center gap-1.5 shadow-lg">
                ⚙️ 멤버 이름 설정
            </button>
        </div>

        <!-- 탭 메뉴 -->
        <div class="flex justify-center gap-3">
            <button onclick="switchTab('org')" id="btnOrg" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-pink-600 text-white shadow-lg shadow-pink-600/30">
                👑 조직도 및 출퇴근
            </button>
            <button onclick="switchTab('logs')" id="btnLogs" class="px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-[#1a0f1c] text-pink-400/70 border border-pink-500/20 hover:text-white">
                📊 근무 시간 집계표
            </button>
        </div>

        <!-- 1. 조직도 & 출퇴근 카드 화면 (동적 렌더링) -->
        <div id="viewOrg" class="space-y-6">
            <!-- JOKER 상단 특별 카드 -->
            <div id="jokerCardContainer" class="flex justify-center"></div>

            <!-- 하위 멤버 그리드 -->
            <div id="membersGridContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </div>

        <!-- 2. 근무 시간 집계표 화면 -->
        <div id="viewLogs" class="bg-[#130717] border border-pink-500/30 rounded-2xl p-6 shadow-xl hidden space-y-4">
            <div class="flex justify-between items-center border-b border-pink-500/20 pb-3">
                <h2 class="text-lg font-bold text-pink-400">📈 출퇴근 및 근무 시간 집계 기록</h2>
                <button onclick="clearLogs()" class="px-3 py-1 bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs hover:bg-red-500 hover:text-white transition">기록 초기화</button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead>
                        <tr class="border-b border-pink-500/25 text-pink-300">
                            <th class="py-3 px-2">날짜</th>
                            <th class="py-3 px-2">멤버명 (직급)</th>
                            <th class="py-3 px-2">출근 시간</th>
                            <th class="py-3 px-2">퇴근 시간</th>
                            <th class="py-3 px-2 text-right">총 근무 시간</th>
                        </tr>
                    </thead>
                    <tbody id="logsTableBody" class="divide-y divide-pink-500/10">
                        <!-- 동적 삽입 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 출퇴근 컨트롤 모달 -->
    <div id="actionModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-[#1a0f1c] border-2 border-pink-500 rounded-2xl w-full max-w-sm p-6 text-center space-y-4 neon-glow">
            <h3 id="modalMemberName" class="text-2xl font-extrabold text-white">멤버 이름</h3>
            <p id="modalMemberRank" class="text-xs text-pink-400 font-semibold">직급</p>
            
            <div id="modalCurrentState" class="p-3 bg-[#110714] rounded-xl border border-pink-500/20 text-sm font-medium text-zinc-300">
                상태 확인 중...
            </div>

            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="handleCheckIn()" class="py-3 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-emerald-900/30">
                    🟢 출근하기
                </button>
                <button onclick="handleCheckOut()" class="py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-rose-900/30">
                    🔴 퇴근하기
                </button>
            </div>

            <button onclick="closeModal()" class="w-full py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-xs transition mt-2">
                닫기
            </button>
        </div>
    </div>

    <!-- 멤버 이름 설정 모달 -->
    <div id="settingsModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-[#1a0f1c] border-2 border-pink-500 rounded-2xl w-full max-w-md p-6 space-y-4 neon-glow max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-pink-500/20 pb-3">
                <h3 class="text-lg font-bold text-pink-400">⚙️ 멤버 이름 설정</h3>
                <button onclick="closeSettingsModal()" class="text-zinc-400 hover:text-white text-sm">✕</button>
            </div>
            
            <p class="text-xs text-zinc-400">각 직급별 멤버의 이름을 자유롭게 수정할 수 있습니다.</p>

            <div id="settingsFormContainer" class="space-y-3">
                <!-- 자바스크립트로 동적 생성됨 -->
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="saveMemberNames()" class="flex-1 py-3 bg-pink-600 hover:bg-pink-500 text-white font-bold rounded-xl text-sm transition shadow-lg shadow-pink-600/30">
                    저장하기
                </button>
                <button onclick="resetDefaultNames()" class="px-4 py-3 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 rounded-xl text-sm transition">
                    기본값 복원
                </button>
            </div>
        </div>
    </div>

    <!-- 스크립트 로직 -->
    <script>
        let currentSelectedMember = null;

        // 기본 멤버 구성 정의
        const defaultMembers = [
            { id: 'joker', role: 'JOKER', name: '밤망이', desc: 'P.P를 대표하는 존재', icon: '👑', badgeColor: 'bg-pink-500 text-white' },
            { id: 'ace', role: 'HEART • Ace', name: '랑랑', desc: 'P.P의 중심이 되는 멤버', icon: '💎', badgeColor: 'bg-rose-500/20 text-rose-300 border border-rose-500/30' },
            { id: 'king', role: 'HEART • King', name: '뽀오니', desc: 'P.P의 중심이 되는 멤버', icon: '👑', badgeColor: 'bg-rose-500/20 text-rose-300 border border-rose-500/30' },
            { id: 'queen', role: 'DIAMOND • Queen', name: '김나박이', desc: 'P.P에서 신뢰받는 멤버', icon: '💠', badgeColor: 'bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30' },
            { id: 'jack', role: 'DIAMOND • Jack', name: '하연지', desc: 'P.P에서 신뢰받는 멤버', icon: '♠️', badgeColor: 'bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30' },
            { id: 'spade10', role: 'SPADE • 10', name: '공주아', desc: 'P.P와 함께 활동하는 멤버', icon: '⚔️', badgeColor: 'bg-purple-500/20 text-purple-300 border border-purple-500/30' },
            { id: 'clover9', role: 'CLOVER • 9', name: '냐냥', desc: 'P.P의 시작을 함께하는 멤버', icon: '🍀', badgeColor: 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' }
        ];

        // 멤버 정보 불러오기/저장하기
        function getMembers() {
            let saved = localStorage.getItem('pp_custom_members');
            if (!saved) {
                return defaultMembers;
            }
            return JSON.parse(saved);
        }

        function saveMembers(members) {
            localStorage.setItem('pp_custom_members', JSON.stringify(members));
        }

        function getAttendanceData() {
            return JSON.parse(localStorage.getItem('pp_attendance_active') || '{}');
        }
        function setAttendanceData(data) {
            localStorage.setItem('pp_attendance_active', JSON.stringify(data));
        }
        function getLogsData() {
            return JSON.parse(localStorage.getItem('pp_attendance_logs') || '[]');
        }
        function setLogsData(data) {
            localStorage.setItem('pp_attendance_logs', JSON.stringify(data));
        }

        // 탭 전환
        function switchTab(tab) {
            const btnOrg = document.getElementById('btnOrg');
            const btnLogs = document.getElementById('btnLogs');
            const viewOrg = document.getElementById('viewOrg');
            const viewLogs = document.getElementById('viewLogs');

            if (tab === 'org') {
                btnOrg.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-pink-600 text-white shadow-lg shadow-pink-600/30";
                btnLogs.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-[#1a0f1c] text-pink-400/70 border border-pink-500/20 hover:text-white";
                viewOrg.classList.remove('hidden');
                viewLogs.classList.add('hidden');
                renderOrgChart();
            } else {
                btnLogs.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-pink-600 text-white shadow-lg shadow-pink-600/30";
                btnOrg.className = "px-6 py-2.5 rounded-xl font-bold text-sm transition-all bg-[#1a0f1c] text-pink-400/70 border border-pink-500/20 hover:text-white";
                viewLogs.classList.remove('hidden');
                viewOrg.classList.add('hidden');
                renderLogsTable();
            }
        }

        // 조직도 렌더링
        function renderOrgChart() {
            let members = getMembers();
            let activeData = getAttendanceData();

            let joker = members.find(m => m.id === 'joker');
            let others = members.filter(m => m.id !== 'joker');

            // JOKER 카드 렌더링
            let jokerRec = activeData[joker.name];
            let jokerStatusHtml = jokerRec && jokerRec.status === '출근'
                ? `<div class="mt-3 inline-block px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">🟢 근무 중</div>`
                : `<div class="mt-3 inline-block px-3 py-1 rounded-full text-xs font-bold bg-zinc-800 text-zinc-400 border border-zinc-700">🔴 퇴근 상태</div>`;

            document.getElementById('jokerCardContainer').innerHTML = `
                <div onclick="openCheckInModal('${joker.name}', '${joker.role}')" class="w-full max-w-sm bg-gradient-to-b from-[#25102a] to-[#130717] border-2 border-pink-500 rounded-2xl p-5 text-center cursor-pointer transform hover:scale-105 transition neon-glow relative overflow-hidden">
                    <div class="absolute top-2 right-3 text-xs px-2 py-0.5 bg-pink-500 text-white rounded-full font-bold">JOKER</div>
                    <div class="w-20 h-20 mx-auto rounded-full bg-pink-500/20 border-2 border-pink-400 flex items-center justify-center text-2xl font-black mb-3 text-pink-300 shadow-inner">
                        ${joker.icon}
                    </div>
                    <h2 class="text-xl font-bold text-white">${joker.name}</h2>
                    <p class="text-xs text-pink-400 font-medium mt-1">${joker.desc}</p>
                    ${jokerStatusHtml}
                </div>
            `;

            // 하위 멤버 그리드 렌더링
            let gridHtml = '';
            others.forEach(m => {
                let rec = activeData[m.name];
                let statusHtml = rec && rec.status === '출근'
                    ? `<div class="mt-3 inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">🟢 근무 중</div>`
                    : `<div class="mt-3 inline-block px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-zinc-800 text-zinc-400">🔴 퇴근</div>`;

                gridHtml += `
                    <div onclick="openCheckInModal('${m.name}', '${m.role}')" class="bg-[#170a1c] border border-pink-500/30 rounded-2xl p-4 text-center cursor-pointer hover:border-pink-500 transition hover:bg-[#200d26]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] px-2 py-0.5 rounded font-bold ${m.badgeColor}">${m.role}</span>
                        </div>
                        <div class="w-14 h-14 mx-auto rounded-full bg-pink-500/10 border border-pink-500/30 flex items-center justify-center text-lg mb-2">${m.icon}</div>
                        <h3 class="font-bold text-white text-base">${m.name}</h3>
                        <p class="text-[11px] text-pink-300/60 mt-0.5">${m.desc}</p>
                        ${statusHtml}
                    </div>
                `;
            });
            document.getElementById('membersGridContainer').innerHTML = gridHtml;
        }

        // 모달 관련
        function openCheckInModal(name, rank) {
            currentSelectedMember = { name, rank };
            document.getElementById('modalMemberName').innerText = name;
            document.getElementById('modalMemberRank').innerText = rank;

            let activeData = getAttendanceData();
            let record = activeData[name];
            let stateEl = document.getElementById('modalCurrentState');

            if (record && record.status === '출근') {
                stateEl.innerHTML = `현재 상태: <span class="text-emerald-400 font-bold">근무 중</span><br><span class="text-[11px] text-zinc-400">출근 시각: ${record.timeStr}</span>`;
            } else {
                stateEl.innerHTML = `현재 상태: <span class="text-rose-400 font-bold">퇴근(미출근)</span>`;
            }

            document.getElementById('actionModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('actionModal').classList.add('hidden');
            currentSelectedMember = null;
            renderOrgChart();
        }

        // 출근 처리
        function handleCheckIn() {
            if (!currentSelectedMember) return;
            let activeData = getAttendanceData();
            let now = new Date();
            
            activeData[currentSelectedMember.name] = {
                status: '출근',
                timestamp: now.getTime(),
                dateStr: now.toLocaleDateString(),
                timeStr: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                rank: currentSelectedMember.rank
            };

            setAttendanceData(activeData);
            alert(`[${currentSelectedMember.name}] 출근 처리가 완료되었습니다! 🟢`);
            closeModal();
        }

        // 퇴근 처리 및 시간 계산
        function handleCheckOut() {
            if (!currentSelectedMember) return;
            let activeData = getAttendanceData();
            let record = activeData[currentSelectedMember.name];

            if (!record || record.status !== '출근') {
                alert('현재 출근 상태가 아닙니다.');
                return;
            }

            let now = new Date();
            let checkInTime = new Date(record.timestamp);
            let diffMs = now - checkInTime;
            
            let diffHrs = Math.floor(diffMs / (1000 * 60 * 60));
            let diffMins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
            let workDurationStr = `${diffHrs}시간 ${diffMins}분`;

            let logs = getLogsData();
            logs.unshift({
                date: record.dateStr,
                name: currentSelectedMember.name,
                rank: currentSelectedMember.rank,
                checkIn: record.timeStr,
                checkOut: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                duration: workDurationStr
            });
            setLogsData(logs);

            delete activeData[currentSelectedMember.name];
            setAttendanceData(activeData);

            alert(`[${currentSelectedMember.name}] 퇴근 완료!\n총 근무 시간: ${workDurationStr} 🔴`);
            closeModal();
        }

        // 설정 모달 열기/닫기 및 저장
        function openSettingsModal() {
            let members = getMembers();
            let container = document.getElementById('settingsFormContainer');
            container.innerHTML = '';

            members.forEach(m => {
                container.innerHTML += `
                    <div class="flex items-center gap-3 bg-[#110714] p-3 rounded-xl border border-pink-500/20">
                        <div class="w-24 text-xs font-bold text-pink-300">${m.role}</div>
                        <input type="text" id="input_${m.id}" value="${m.name}" class="flex-1 px-3 py-2 bg-[#1a0f1c] border border-pink-500/30 rounded-lg text-white text-sm focus:outline-none focus:border-pink-500">
                    </div>
                `;
            });

            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function saveMemberNames() {
            let members = getMembers();
            members.forEach(m => {
                let inputEl = document.getElementById(`input_${m.id}`);
                if (inputEl) {
                    let val = inputEl.value.trim();
                    if (val) m.name = val;
                }
            });
            saveMembers(members);
            closeSettingsModal();
            renderOrgChart();
            alert('멤버 이름이 성공적으로 저장되었습니다!');
        }

        function resetDefaultNames() {
            if (confirm('모든 멤버 이름을 기본값으로 되돌리시겠습니까?')) {
                localStorage.removeItem('pp_custom_members');
                closeSettingsModal();
                renderOrgChart();
                alert('기본값으로 복원되었습니다.');
            }
        }

        // 근무 시간 집계표 렌더링
        function renderLogsTable() {
            let logs = getLogsData();
            let tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = '';

            if (logs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-6 text-center text-zinc-500">아직 집계된 출퇴근 기록이 없습니다.</td></tr>`;
                return;
            }

            logs.forEach(log => {
                tbody.innerHTML += `
                    <tr class="hover:bg-pink-500/5 transition">
                        <td class="py-3 px-2 text-zinc-300">${log.date}</td>
                        <td class="py-3 px-2 font-bold text-white">${log.name} <span class="text-[10px] text-pink-400 font-normal">(${log.rank})</span></td>
                        <td class="py-3 px-2 text-emerald-400">${log.checkIn}</td>
                        <td class="py-3 px-2 text-rose-400">${log.checkOut}</td>
                        <td class="py-3 px-2 text-right font-bold text-pink-300">${log.duration}</td>
                    </tr>
                `;
            });
        }

        function clearLogs() {
            if (confirm('모든 출퇴근 집계 기록을 초기화하시겠습니까?')) {
                localStorage.removeItem('pp_attendance_logs');
                renderLogsTable();
            }
        }

        // 첫 로드 시 조직도 렌더링
        window.onload = function() {
            renderOrgChart();
        };
    </script>
</body>
</html>
